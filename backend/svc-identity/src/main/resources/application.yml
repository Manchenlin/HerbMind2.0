server:
  port: 8081

spring:
  application:
    name: svc-identity
  datasource:
    url: jdbc:postgresql://localhost:5432/herbmind
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # password_hash -> passwordHash
  global-config:
    db-config:
      id-type: input                      # ID 由业务传入（TEXT）

herbmind:
  jwt:
    # HS256 要求密钥 >= 32 字节；生产环境务必改掉并通过环境变量注入
    secret: herbmind-dev-jwt-secret-please-change-before-prod-0123456789
    expire-hours: 12
