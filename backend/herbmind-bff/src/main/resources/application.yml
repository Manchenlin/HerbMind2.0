server:
  port: 8090

spring:
  application:
    name: herbmind-bff
  jackson:
    default-property-inclusion: non_null
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 10000

# 本地开发：静态直连 svc（免 Nacos）。集成日改为服务名发现即可。
herbmind:
  # 域2（身份 / 成长）
  svc-identity-url: http://localhost:8081
  svc-training-url: http://localhost:8084
  # 域1（内容）
  svc-catalog-url: http://localhost:8082
  svc-search-url: http://localhost:8083
  svc-insight-url: http://localhost:8086

logging:
  level:
    com.herbmind: debug
