<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>检索工作台 · HerbMind</title>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<div id="progress"></div>
<header class="topbar"></header>

<main class="wrap">
  <div class="crumb"><a href="index.html">首页</a> / 检索</div>
  <h1 class="serif" style="margin-bottom:6px">检索工作台</h1>
  <p class="muted" style="margin-bottom:22px">结构化筛选 + 自然语言语义检索，两种方式任意组合。</p>

  <div class="card" style="margin-bottom:20px">
    <div class="hero-search" style="max-width:none">
      <input class="input" id="q" value="无汗而喘、脉浮紧用什么方" aria-label="检索词">
      <a class="btn primary" href="search-result.html">检索</a>
    </div>
    <div class="muted" style="margin-top:10px;font-size:13px">语义检索：向量召回 bge-m3 ⊕ 中文全文 pg_jieba，混合排序</div>
  </div>

  <div class="grid cols-2">
    <!-- 结构化筛选 -->
    <div class="card">
      <h3 style="margin-bottom:6px">结构化筛选</h3>
      <p class="muted" style="margin-bottom:14px">点选维度任意组合（原型演示）。</p>

      <div style="margin-bottom:14px">
        <div class="muted" style="margin-bottom:6px">经典著作</div>
        <div id="f-classic" style="display:flex;gap:8px;flex-wrap:wrap">
          <span class="chip clickable sel">伤寒论</span>
          <span class="chip clickable">温病学</span>
          <span class="chip clickable">金匮要略</span>
        </div>
      </div>
      <div style="margin-bottom:14px">
        <div class="muted" style="margin-bottom:6px">证候 / 症状</div>
        <div id="f-symp" style="display:flex;gap:8px;flex-wrap:wrap">
          <span class="chip clickable sel">无汗</span>
          <span class="chip clickable">恶风</span>
          <span class="chip clickable sel">脉浮紧</span>
          <span class="chip clickable">发热</span>
          <span class="chip clickable">项背强</span>
        </div>
      </div>
      <div style="margin-bottom:6px">
        <div class="muted" style="margin-bottom:6px">药味</div>
        <div id="f-herb" style="display:flex;gap:8px;flex-wrap:wrap">
          <span class="chip clickable sel">麻黄</span>
          <span class="chip clickable">桂枝</span>
          <span class="chip clickable">杏仁</span>
          <span class="chip clickable">葛根</span>
        </div>
      </div>
      <div class="hr"></div>
      <div style="display:flex;gap:10px">
        <a class="btn primary sm" href="search-result.html">应用筛选</a>
        <button class="btn ghost sm" onclick="document.querySelectorAll('.chip.sel').forEach(c=>c.classList.remove('sel'))">重置</button>
      </div>
    </div>

    <!-- 检索方式说明 + 反向索引 -->
    <div class="card">
      <h3 style="margin-bottom:14px">其它入口</h3>
      <a class="rowitem" href="search-result.html" style="margin-bottom:10px"><span class="thumb">语</span>
        <div><b>自然语言语义检索</b><div class="muted">一句话描述症状，返回最匹配的方证</div></div></a>
      <a class="rowitem" href="quote.html" style="margin-bottom:10px"><span class="thumb">条</span>
        <div><b>条文反向索引</b><div class="muted">点条文看哪些方/案引用它；点方看相关条文</div></div></a>
      <a class="rowitem" href="graph.html"><span class="thumb">图</span>
        <div><b>在图谱中展开</b><div class="muted">把检索结果映射为知识图谱子图</div></div></a>
    </div>
  </div>
</main>

<footer></footer>
<script src="assets/mock.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('#f-classic .chip, #f-symp .chip, #f-herb .chip').forEach(function(c){
      c.addEventListener('click', function(){ c.classList.toggle('sel'); });
    });
  });
</script>
<script src="assets/app.js"></script>
</body>
</html>
