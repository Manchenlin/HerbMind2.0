<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习档案 · HerbMind</title>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<div id="progress"></div>
<header class="topbar"></header>

<main class="wrap">
  <div class="crumb"><a href="index.html">首页</a> / <a href="me.html">我的</a> / 学习档案</div>
  <h1 class="serif" style="margin-bottom:6px">学习档案</h1>
  <p class="muted" style="margin-bottom:22px">按三部经典拆解你的掌握度，并给出下一步学习路径。</p>

  <div class="grid" style="grid-template-columns:360px 1fr">
    <section class="card">
      <h3 style="margin-bottom:6px">综合能力雷达</h3>
      <svg id="radar" viewBox="0 0 320 320" style="width:100%"></svg>
    </section>

    <section style="display:grid;gap:16px">
      <div class="card">
        <h3 style="margin-bottom:14px">三经典掌握度</h3>
        <div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between"><span>《伤寒论》太阳篇</span><b>82%</b></div>
          <div style="height:8px;background:var(--surface-2);border-radius:8px;margin-top:6px"><div style="width:82%;height:100%;background:var(--primary);border-radius:8px"></div></div></div>
        <div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between"><span>《温病学》</span><b>58%</b></div>
          <div style="height:8px;background:var(--surface-2);border-radius:8px;margin-top:6px"><div style="width:58%;height:100%;background:#4F8A8B;border-radius:8px"></div></div></div>
        <div><div style="display:flex;justify-content:space-between"><span>《金匮要略》</span><b>66%</b></div>
          <div style="height:8px;background:var(--surface-2);border-radius:8px;margin-top:6px"><div style="width:66%;height:100%;background:var(--gold);border-radius:8px"></div></div></div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:12px">推荐学习路径 <span class="chip primary" style="font-size:11px">按图谱先修 + 薄弱点</span></h3>
        <div class="stagger" style="display:grid;gap:10px">
          <div class="rowitem"><span class="thumb">1</span><div><b>麻黄汤证</b><div class="muted">先修：太阳伤寒总论（已掌握）</div></div></div>
          <div class="rowitem"><span class="thumb">2</span><div><b>葛根汤证</b><div class="muted">由麻黄汤派生 · 建议下一步</div></div></div>
          <div class="rowitem"><span class="thumb">3</span><div><b>大青龙汤证</b><div class="muted">麻黄汤类 · 兼里热</div></div></div>
        </div>
        <a class="btn primary sm" style="margin-top:14px" href="train.html">开始学习路径</a>
      </div>

      <div class="card">
        <h3 style="margin-bottom:10px">薄弱点</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <span class="chip accent">温病卫气营血辨证</span>
          <span class="chip accent">兼证加减</span>
          <span class="chip accent">舌脉鉴别</span>
        </div>
      </div>
    </section>
  </div>
</main>

<footer></footer>
<script src="assets/mock.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function(){
    var svg = document.getElementById('radar'), data = MOCK.radar, N=data.length, cx=160, cy=160, R=110;
    function pt(i,r){ var a=-Math.PI/2+i*2*Math.PI/N; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
    var s='';
    [0.25,0.5,0.75,1].forEach(function(k){ s+='<polygon class="radar-ring" points="'+data.map(function(_,i){return pt(i,R*k).join(',');}).join(' ')+'"/>'; });
    data.forEach(function(d,i){ var p=pt(i,R); s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#ECECE8"/>';
      var lp=pt(i,R+22); s+='<text x="'+lp[0]+'" y="'+lp[1]+'" text-anchor="middle" font-size="11" fill="#6B7280">'+d.k+'</text>'; });
    s+='<polygon class="radar-shape" points="'+data.map(function(d,i){return pt(i,R*d.v/100).join(',');}).join(' ')+'"/>';
    data.forEach(function(d,i){ var p=pt(i,R*d.v/100); s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="#2E7D6F"/>'; });
    svg.innerHTML=s;
  });
</script>
<script src="assets/app.js"></script>
</body>
</html>
