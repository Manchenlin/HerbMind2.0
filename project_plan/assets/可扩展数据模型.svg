<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
  <style>
    .bg{fill:#FAFAF8}
    .title{fill:#1F2328;font-size:19px;font-weight:800}
    .sub{fill:#6B7280;font-size:12.5px}
    .t{font-size:14px;font-weight:700}
    .ts{font-size:12px}
  </style>
  <rect class="bg" x="0" y="0" width="720" height="520"/>
  <text class="title" x="30" y="42">可扩展数据模型 · 骨架共用 + 类型特化</text>
  <text class="sub" x="30" y="63">一套平台适配多类书籍；PG 分层承载，Neo4j 统一本体承接</text>

  <defs><marker id="up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

  <!-- ④ content_unit -->
  <rect x="40" y="84" width="640" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text class="t" x="360" y="106" fill="#085041" text-anchor="middle">④ 统一内容单元 content_unit</text>
  <text class="ts" x="360" y="126" fill="#0F6E56" text-anchor="middle">向量 + 中文全文 · 检索 / RAG 的唯一入口（现 rag_chunk 升级版）</text>

  <!-- ③ 特化实体 -->
  <rect x="40" y="166" width="150" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text class="t" x="115" y="188" fill="#0C447C" text-anchor="middle">方证类</text>
  <text class="ts" x="115" y="208" fill="#185FA5" text-anchor="middle">formula / quote</text>
  <rect x="203" y="166" width="150" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text class="t" x="278" y="188" fill="#0C447C" text-anchor="middle">本草类</text>
  <text class="ts" x="278" y="208" fill="#185FA5" text-anchor="middle">herb 药材专论</text>
  <rect x="366" y="166" width="150" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text class="t" x="441" y="188" fill="#0C447C" text-anchor="middle">药品类</text>
  <text class="ts" x="441" y="208" fill="#185FA5" text-anchor="middle">drug 中成药</text>
  <rect x="529" y="166" width="151" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text class="t" x="604" y="188" fill="#0C447C" text-anchor="middle">医案类</text>
  <text class="ts" x="604" y="208" fill="#185FA5" text-anchor="middle">case 复用</text>

  <!-- ② book_node -->
  <rect x="40" y="250" width="640" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text class="t" x="360" y="272" fill="#3C3489" text-anchor="middle">③ 通用目录骨架 book_node</text>
  <text class="ts" x="360" y="292" fill="#534AB7" text-anchor="middle">章 / 节 / 类 / 单元 —— 任意书都能套的阅读树（自引用 parent_id）</text>

  <!-- ① book -->
  <rect x="40" y="334" width="640" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text class="t" x="360" y="356" fill="#633806" text-anchor="middle">① 语料注册 book（顶层）</text>
  <text class="ts" x="360" y="376" fill="#854F0B" text-anchor="middle">书名 · 类型（方证 / 本草 / 药品 / 医案）· 版权状态 · 入库状态</text>

  <!-- arrows up -->
  <line x1="360" y1="334" x2="360" y2="310" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#up)"/>
  <line x1="360" y1="250" x2="360" y2="230" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#up)"/>
  <line x1="360" y1="166" x2="360" y2="144" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#up)"/>

  <!-- 关系泛化 -->
  <rect x="40" y="410" width="312" height="52" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.6"/>
  <text x="196" y="432" class="ts" font-weight="700" fill="#2C2C2A" text-anchor="middle">关系表：核心用专属表（类型安全）</text>
  <text x="196" y="450" class="ts" fill="#5F5E5A" text-anchor="middle">formula_herb / case_quote_rel …</text>
  <rect x="368" y="410" width="312" height="52" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.6"/>
  <text x="524" y="432" class="ts" font-weight="700" fill="#2C2C2A" text-anchor="middle">跨域 / 小众关系用通用表兜底</text>
  <text x="524" y="450" class="ts" fill="#5F5E5A" text-anchor="middle">relation(from,to,rel_type,props jsonb)</text>

  <!-- Neo4j -->
  <rect x="40" y="476" width="640" height="34" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="360" y="497" class="ts" fill="#0C447C" text-anchor="middle">Neo4j · 统一本体：标准 Label + 关系类型；跨书同名实体自动合并（麻黄 = 同一节点）</text>
</svg>
