<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
  <style>
    .bg{fill:#FAFAF8}
    .title{fill:#1F2328;font-size:20px;font-weight:800}
    .sub{fill:#6B7280;font-size:12.5px}
    .box{fill:#FFFFFF;stroke:#D9DED9;stroke-width:1.3;rx:10}
    .t{fill:#1F2328;font-size:13px;font-weight:600}
    .ts{fill:#5A6470;font-size:11px}
    .g{fill:#2E7D6F}.gp{fill:#7A6BB5}.b{fill:#3B7DD8}.m{fill:#6B7280}.o{fill:#D9724E}
    .hw{fill:#FFFFFF;font-size:12.5px;font-weight:700}
    .arw{stroke:#9AA6A0;stroke-width:1.6;fill:none;marker-end:url(#a)}
    .lane{fill:#F1F0EA;rx:10}
    .lt{fill:#8A8578;font-size:11px;font-weight:700;letter-spacing:1px}
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#9AA6A0"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="680"/>
  <text class="title" x="40" y="46">HerbMind 系统架构图</text>
  <text class="sub" x="40" y="68">Spring Cloud 微服务 + Nacos + PostgreSQL/Neo4j/Redis + LangChain 1.x Agent（云 LLM）</text>

  <!-- lane: client -->
  <rect class="lane" x="24" y="86" width="952" height="72"/>
  <text class="lt" x="36" y="104">客户端</text>
  <rect class="box" x="360" y="96" width="280" height="50"/>
  <text class="t" x="500" y="117" text-anchor="middle">浏览器 · Vue3 SPA</text>
  <text class="ts" x="500" y="135" text-anchor="middle">Element Plus · Pinia · Axios · Vite</text>

  <!-- nginx -->
  <line class="arw" x1="500" y1="158" x2="500" y2="182"/>
  <rect class="box" x="360" y="182" width="280" height="46"/>
  <text class="t" x="500" y="202" text-anchor="middle">Nginx :80</text>
  <text class="ts" x="500" y="219" text-anchor="middle">前端静态资源 + /api 反向代理</text>

  <!-- gateway -->
  <line class="arw" x1="500" y1="228" x2="500" y2="252"/>
  <rect class="box" x="320" y="252" width="360" height="48" style="stroke:#2E7D6F"/>
  <text class="hw" x="500" y="272" text-anchor="middle" style="fill:#1F5C52">Gateway :8080</text>
  <text class="ts" x="500" y="290" text-anchor="middle">JWT 鉴权 · 路由 · 限流（只暴露 /api/biz/** · /api/agent/**）</text>

  <!-- bff + agent -->
  <line class="arw" x1="360" y1="300" x2="250" y2="330"/>
  <line class="arw" x1="640" y1="300" x2="750" y2="330"/>
  <rect class="box" x="90" y="330" width="330" height="56" style="stroke:#2E7D6F"/>
  <text class="hw" x="255" y="352" text-anchor="middle" style="fill:#1F5C52">HerbMind-BFF :8090</text>
  <text class="ts" x="255" y="372" text-anchor="middle">按页面聚合 · 统一 R&lt;T&gt;（前端唯一入口）</text>

  <rect class="box" x="580" y="330" width="330" height="56" style="stroke:#7A6BB5"/>
  <text class="hw" x="745" y="352" text-anchor="middle" style="fill:#5B4E92">herbmind-agent :8091</text>
  <text class="ts" x="745" y="372" text-anchor="middle">FastAPI + LangChain 1.x（多工具 Agent · SSE）</text>

  <!-- services -->
  <line class="arw" x1="255" y1="386" x2="255" y2="412"/>
  <line class="arw" x1="745" y1="386" x2="745" y2="412"/>
  <text class="lt" x="36" y="410">业务服务</text>

  <rect class="box" x="40"  y="418" width="124" height="52" style="stroke:#3B7DD8"/>
  <text class="t" x="102" y="440" text-anchor="middle">identity</text>
  <text class="ts" x="102" y="458" text-anchor="middle">:8081</text>

  <rect class="box" x="176" y="418" width="124" height="52" style="stroke:#3B7DD8"/>
  <text class="t" x="238" y="440" text-anchor="middle">catalog</text>
  <text class="ts" x="238" y="458" text-anchor="middle">:8082</text>

  <rect class="box" x="312" y="418" width="124" height="52" style="stroke:#3B7DD8"/>
  <text class="t" x="374" y="440" text-anchor="middle">search</text>
  <text class="ts" x="374" y="458" text-anchor="middle">:8083</text>

  <rect class="box" x="448" y="418" width="124" height="52" style="stroke:#3B7DD8"/>
  <text class="t" x="510" y="440" text-anchor="middle">training</text>
  <text class="ts" x="510" y="458" text-anchor="middle">:8084</text>

  <rect class="box" x="584" y="418" width="124" height="52" style="stroke:#3B7DD8"/>
  <text class="t" x="646" y="440" text-anchor="middle">graph</text>
  <text class="ts" x="646" y="458" text-anchor="middle">:8085</text>

  <rect class="box" x="720" y="418" width="124" height="52" style="stroke:#3B7DD8"/>
  <text class="t" x="782" y="440" text-anchor="middle">insight</text>
  <text class="ts" x="782" y="458" text-anchor="middle">:8086</text>

  <rect class="box" x="856" y="418" width="120" height="52" style="stroke:#3B7DD8"/>
  <text class="t" x="916" y="440" text-anchor="middle">governance</text>
  <text class="ts" x="916" y="458" text-anchor="middle">:8087</text>

  <!-- middleware -->
  <line class="arw" x1="500" y1="470" x2="500" y2="500"/>
  <text class="lt" x="36" y="498">中间件（Docker Desktop · 开发期仅此）</text>

  <rect class="box" x="90"  y="508" width="200" height="56" style="stroke:#6B7280"/>
  <text class="t" x="190" y="530" text-anchor="middle">PostgreSQL :5432</text>
  <text class="ts" x="190" y="549" text-anchor="middle">pgvector + pg_jieba + pg_trgm</text>

  <rect class="box" x="310" y="508" width="180" height="56" style="stroke:#6B7280"/>
  <text class="t" x="400" y="530" text-anchor="middle">Neo4j :7687</text>
  <text class="ts" x="400" y="549" text-anchor="middle">知识图谱</text>

  <rect class="box" x="510" y="508" width="160" height="56" style="stroke:#6B7280"/>
  <text class="t" x="590" y="530" text-anchor="middle">Redis :6379</text>
  <text class="ts" x="590" y="549" text-anchor="middle">限流 / 缓存</text>

  <rect class="box" x="690" y="508" width="160" height="56" style="stroke:#6B7280"/>
  <text class="t" x="770" y="530" text-anchor="middle">Nacos :8848</text>
  <text class="ts" x="770" y="549" text-anchor="middle">注册 / 配置</text>

  <!-- cloud -->
  <line class="arw" x1="745" y1="386" x2="900" y2="386" />
  <rect class="box" x="700" y="600" width="260" height="56" style="stroke:#D9724E"/>
  <text class="t" x="830" y="622" text-anchor="middle" style="fill:#B4552F">硅基流动云 API</text>
  <text class="ts" x="830" y="641" text-anchor="middle">LLM Qwen2.5-7B · Embedding bge-m3</text>
  <line class="arw" x1="745" y1="386" x2="830" y2="600" style="stroke:#D9724E"/>
  <text class="ts" x="836" y="480" style="fill:#B4552F">HTTPS</text>

  <text class="sub" x="40" y="648">说明：开发期业务应用跑 IDEA / PyCharm 本地进程；中间件仅用 Docker 跑基础设施；是否整体部署到 Docker/虚拟机由用户决定。</text>
</svg>
